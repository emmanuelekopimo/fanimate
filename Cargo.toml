[workspace]
resolver = "3"
members = [
    "crates/fanimate-core",
    "crates/fanimate-fnm",
    "crates/fanimate-editor",
    "crates/fanimate-render",
    "crates/fanimate-app",
    "crates/fanimate-cli",
]
default-members = [
    "crates/fanimate-core",
    "crates/fanimate-fnm",
    "crates/fanimate-editor",
    "crates/fanimate-render",
    "crates/fanimate-app",
    "crates/fanimate-cli",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toonittmedia/fanimate"
homepage = "https://github.com/toonittmedia/fanimate"
authors = ["The Fanimate Contributors"]

[workspace.dependencies]
fanimate-core = { path = "crates/fanimate-core" }
fanimate-fnm = { path = "crates/fanimate-fnm" }
fanimate-render = { path = "crates/fanimate-render" }
fanimate-editor = { path = "crates/fanimate-editor" }

bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
lyon = "1.0"
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, lyon) are slow unoptimised; our own code stays debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

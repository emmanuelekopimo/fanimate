name: Release

# Runs only when a release tag is pushed (by `pnpm release`) or when started
# by hand from the Actions tab. Ordinary pushes do not run CI; `pnpm release`
# runs fmt, clippy and the tests locally before it tags.
#
# A tag push builds and tests on all three platforms, then drafts a GitHub
# release with the binaries attached. A manual run does the same builds but
# only keeps them as workflow artifacts, without touching releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing libraries and a software Vulkan driver
        # lavapipe lets the GPU render test run without a GPU
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: WebAssembly build (engine crates)
        run: cargo check -p fanimate-core -p fanimate-fnm -p fanimate-editor -p fanimate-render --target wasm32-unknown-unknown
      - name: Headless render smoke test
        run: |
          cargo run -q -p fanimate-cli -- sample benchmark bench.fnm
          cargo run -q -p fanimate-cli -- validate bench.fnm
          cargo run -q -p fanimate-cli -- render bench.fnm -o bench.png --frame 30 --width 640
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Brand tokens
        run: pip install pillow pymupdf && python brand/scripts/build_brand.py --check

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: .exe
          # 22.04 rather than ubuntu-latest: binaries built against a newer
          # glibc do not run on older, still-common distributions.
          - name: linux-x64
            os: ubuntu-22.04
            exe: ""
          - name: macos-arm64
            os: macos-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing libraries and a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev mesa-vulkan-drivers nasm
      - name: Install FFmpeg build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install FFmpeg build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            make diffutils git xz
      # Video export runs FFmpeg as a separate program. It is built here
      # from pinned, checked sources, and those exact sources are published
      # with the release (docs/legal/video-export.md).
      - name: Reuse the FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/build-ffmpeg.sh ffmpeg-out
      - name: Build FFmpeg (Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh ffmpeg-out
      - name: Fetch Rhubarb Lip Sync
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) p=windows ;; macOS) p=macos ;; *) p=linux ;; esac
          bash scripts/fetch-rhubarb.sh "$p" rhubarb-out
      - name: Test
        # with the FFmpeg that ships, so the video export test uses it
        shell: bash
        run: PATH="$PWD/ffmpeg-out:$PATH" cargo test --workspace --release
      - name: Build
        run: cargo build --release -p fanimate-app -p fanimate-cli
      - name: Headless render and benchmark
        # Shows that the renderer works on every platform and records the
        # numbers in the run summary. Hosted runners have no real GPU (a
        # software renderer or a virtual GPU), so the GPU figures are a smoke
        # test, not the performance budget; that is measured on the reference
        # laptops. A failure here is reported but does not stop the release.
        continue-on-error: true
        shell: bash
        run: |
          cli="target/release/fanimate-cli${{ matrix.exe }}"
          "$cli" sample benchmark bench.fnm
          "$cli" render bench.fnm -o "render-${{ matrix.name }}.png" --frame 30 --width 640
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            "$cli" bench --gpu
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the render for cross-platform comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.name }}
          path: render-${{ matrix.name }}.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="dev-${GITHUB_SHA::7}"
          dir="fanimate-${version}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/release/fanimate${{ matrix.exe }}" "target/release/fanimate-cli${{ matrix.exe }}" "dist/$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$dir/"
          # the programs Fanimate runs: FFmpeg for video, Rhubarb for lip sync
          mkdir -p "dist/$dir/ffmpeg" "dist/$dir/rhubarb"
          cp ffmpeg-out/ffmpeg${{ matrix.exe }} ffmpeg-out/LICENSE.txt ffmpeg-out/README.txt "dist/$dir/ffmpeg/"
          cp -R rhubarb-out/. "dist/$dir/rhubarb/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "file=dist/$dir.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$dir.tar.gz" "$dir"
            echo "file=dist/$dir.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fanimate-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          retention-days: 30
      - name: Keep FFmpeg's sources for the release
        # the same sources on every platform; published once
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: fanimate-sources
          path: |
            ffmpeg-out/source/*.tar.xz
          retention-days: 30

  publish:
    name: Draft GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the packages only, not the comparison renders
          pattern: fanimate-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # 0.x versions are pre-releases until 1.0
          pre=""
          case "$tag" in v0.*) pre="--prerelease" ;; esac
          gh release create "$tag" dist/* \
            --draft $pre \
            --title "Fanimate $tag" \
            --generate-notes
